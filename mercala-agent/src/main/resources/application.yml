server:
  port: 8082

spring:
  application:
    name: mercala-agent
  mvc:
    async:
      # MUST stay greater than mercala.agent.stream-timeout below.
      #
      # Tomcat's default async timeout is 30s. A streamed agent turn with tool calls
      # routinely runs longer than that, so with the default the container aborts the
      # response before the application timeout fires — the client gets a truncated SSE
      # stream and none of the ERROR-frame handling ever runs. Leaving the application
      # timeout to win means a slow turn ends with a frame the UI can render instead of a
      # dead connection. Asserted by AgentTimeoutConfigTest.
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:150s}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mercala-agent-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.mercala.contracts.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mercala:
  agent:
    # Bounds the streamed model call. MUST stay below spring.mvc.async.request-timeout so
    # the application terminates the turn with an ERROR frame rather than the container
    # aborting the response underneath it.
    stream-timeout: ${MERCALA_AGENT_STREAM_TIMEOUT:120s}
  kafka:
    product-events-topic: ${MERCALA_KAFKA_PRODUCT_EVENTS_TOPIC:product.events}
    image-requests-topic: ${MERCALA_KAFKA_IMAGE_REQUESTS_TOPIC:image.requests}
    image-results-topic: ${MERCALA_KAFKA_IMAGE_RESULTS_TOPIC:image.results}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/agent/v3/api-docs
