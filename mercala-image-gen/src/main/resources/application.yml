server:
  port: 8083

spring:
  application:
    name: mercala-image-gen
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mercala-image-gen-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.mercala.contracts.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mercala:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Left blank in the deployed stack: the storage client then resolves credentials
    # from the host's IAM instance profile. Defaults here suit the local MinIO container.
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    session-token: ${MINIO_SESSION_TOKEN:}
    region: ${AWS_REGION:}
    bucket: ${MINIO_BUCKET:mercala-images}
  image-gen:
    # Primary provider, then the ordered chain tried when it fails or is unconfigured.
    # 'placeholder' is local and cannot fail, so it anchors the chain.
    provider: ${MERCALA_IMAGE_GEN_PROVIDER:replicate}
    fallback-chain: ${MERCALA_IMAGE_GEN_FALLBACK_CHAIN:pollinations,placeholder}
    replicate:
      api-token: ${REPLICATE_API_TOKEN:}
      model: ${REPLICATE_MODEL:black-forest-labs/flux-schnell}
      wait: ${REPLICATE_WAIT:60s}
      poll-timeout: ${REPLICATE_POLL_TIMEOUT:120s}
      poll-interval: ${REPLICATE_POLL_INTERVAL:1500ms}
      # Model inputs, sent alongside `prompt`. These match flux-schnell's schema —
      # it takes aspect_ratio, NOT width/height. Change these when changing the model.
      # Bracketed keys stop Spring's relaxed binding from mangling the underscores, and
      # the quoting keeps YAML from reading "1:1" as a nested mapping.
      input:
        "[aspect_ratio]": "${REPLICATE_ASPECT_RATIO:1:1}"
        # Overrides the model's webp default. Storage sniffs the real format regardless,
        # but png keeps product imagery in the most widely supported format.
        "[output_format]": "${REPLICATE_OUTPUT_FORMAT:png}"
        "[output_quality]": "${REPLICATE_OUTPUT_QUALITY:90}"
        "[num_outputs]": "1"
    pollinations:
      timeout-seconds: ${POLLINATIONS_TIMEOUT_SECONDS:20}
  kafka:
    product-events-topic: ${MERCALA_KAFKA_PRODUCT_EVENTS_TOPIC:product.events}
    image-requests-topic: ${MERCALA_KAFKA_IMAGE_REQUESTS_TOPIC:image.requests}
    image-results-topic: ${MERCALA_KAFKA_IMAGE_RESULTS_TOPIC:image.results}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
    instances:
      # One instance per remote provider. The router names them "<provider>-image", so a
      # failing backend opens only its own circuit and the chain moves on to the next.
      openai-image:
        baseConfig: default
      replicate-image:
        baseConfig: default
        # Replicate holds the connection open while the model runs, so a slow call is
        # normal rather than a symptom.
        slowCallDurationThreshold: 65s
      pollinations-image:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      openai-image:
        baseConfig: default
      replicate-image:
        baseConfig: default
        # Fewer attempts: each one can occupy a full wait budget, and the chain already
        # provides a cheaper way to recover. Backoff settings stay inherited — setting
        # waitDuration here as well would collide with the inherited interval function.
        maxAttempts: 2
      pollinations-image:
        baseConfig: default

