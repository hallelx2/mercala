server:
  port: 8083

spring:
  application:
    name: mercala-image-gen
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mercala-image-gen-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.mercala.contracts.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mercala:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Left blank in the deployed stack: the storage client then resolves credentials
    # from the host's IAM instance profile. Defaults here suit the local MinIO container.
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    session-token: ${MINIO_SESSION_TOKEN:}
    region: ${AWS_REGION:}
    # Private: merchants' uploaded originals are read from here, and nothing in it is
    # anonymously readable.
    bucket: ${MINIO_BUCKET:mercala-images}
    # Public: finished product imagery is written here, and shoppers load it straight
    # from an <img> tag. Two buckets rather than two prefixes, because the private one
    # also holds the Terraform state, the TLS archive and the database backups (HAL-425).
    public-bucket: ${MINIO_PUBLIC_BUCKET:mercala-public-images}
  image-gen:
    # Primary provider, then the ordered chain tried when it fails or is unconfigured.
    # 'placeholder' is local and cannot fail, so it anchors the chain.
    provider: ${MERCALA_IMAGE_GEN_PROVIDER:cloudflare}
    # Cloudflare runs on a recurring daily free allowance, Replicate on prepaid credit.
    # Cloudflare leads so the default configuration costs nothing; providers reporting
    # themselves unconfigured are skipped, not treated as failures.
    fallback-chain: ${MERCALA_IMAGE_GEN_FALLBACK_CHAIN:replicate,pollinations,placeholder}
    cloudflare:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_API_TOKEN:}
      model: ${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}
      timeout: ${CLOUDFLARE_TIMEOUT:60s}
      # Workers AI rejects prompts beyond this; the provider truncates rather than fails.
      max-prompt-length: 2048
      # flux-1-schnell caps steps at 8 and defaults to 4. SDXL models take num_steps,
      # width, height and negative_prompt instead — change these when changing model.
      input:
        "[steps]": "${CLOUDFLARE_STEPS:4}"
    replicate:
      api-token: ${REPLICATE_API_TOKEN:}
      model: ${REPLICATE_MODEL:black-forest-labs/flux-schnell}
      wait: ${REPLICATE_WAIT:60s}
      poll-timeout: ${REPLICATE_POLL_TIMEOUT:120s}
      poll-interval: ${REPLICATE_POLL_INTERVAL:1500ms}
      # Model inputs, sent alongside `prompt`. These match flux-schnell's schema —
      # it takes aspect_ratio, NOT width/height. Change these when changing the model.
      # Bracketed keys stop Spring's relaxed binding from mangling the underscores, and
      # the quoting keeps YAML from reading "1:1" as a nested mapping.
      input:
        "[aspect_ratio]": "${REPLICATE_ASPECT_RATIO:1:1}"
        # Overrides the model's webp default. Storage sniffs the real format regardless,
        # but png keeps product imagery in the most widely supported format.
        "[output_format]": "${REPLICATE_OUTPUT_FORMAT:png}"
        "[output_quality]": "${REPLICATE_OUTPUT_QUALITY:90}"
        "[num_outputs]": "1"
    pollinations:
      timeout-seconds: ${POLLINATIONS_TIMEOUT_SECONDS:20}
  kafka:
    product-events-topic: ${MERCALA_KAFKA_PRODUCT_EVENTS_TOPIC:product.events}
    image-requests-topic: ${MERCALA_KAFKA_IMAGE_REQUESTS_TOPIC:image.requests}
    image-results-topic: ${MERCALA_KAFKA_IMAGE_RESULTS_TOPIC:image.results}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
    instances:
      # One instance per remote provider. The router names them "<provider>-image", so a
      # failing backend opens only its own circuit and the chain moves on to the next.
      openai-image:
        baseConfig: default
      cloudflare-image:
        baseConfig: default
      replicate-image:
        baseConfig: default
        # Replicate is legitimately slow by design: it holds the connection open for the
        # wait budget (60s) and then polls for up to poll-timeout (120s), so a successful
        # cold-start generation can take ~180s. At the inherited 5s threshold — or even
        # 65s — those successful calls would be counted slow, and a 50% slow-call rate
        # would open the circuit on a provider that is working correctly.
        #
        # Set above the worst realistic case so only pathological calls register. Failure
        # rate, not duration, is the meaningful health signal for this provider.
        slowCallDurationThreshold: 190s
      pollinations-image:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      openai-image:
        baseConfig: default
      cloudflare-image:
        baseConfig: default
      replicate-image:
        baseConfig: default
        # Fewer attempts: each one can occupy a full wait budget, and the chain already
        # provides a cheaper way to recover. Backoff settings stay inherited — setting
        # waitDuration here as well would collide with the inherited interval function.
        maxAttempts: 2
      pollinations-image:
        baseConfig: default

