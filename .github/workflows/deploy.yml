name: Build & Deploy to Cheap AWS Spot Host

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build & Test Java App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests=false

      # Upload built jars for deployment jobs to reuse
      - name: Upload mercala-core Jar
        uses: actions/upload-artifact@v4
        with:
          name: core-jar
          path: mercala-core/target/mercala-core-*.jar

      - name: Upload mercala-agent Jar
        uses: actions/upload-artifact@v4
        with:
          name: agent-jar
          path: mercala-agent/target/mercala-agent-*.jar

      - name: Upload mercala-image-gen Jar
        uses: actions/upload-artifact@v4
        with:
          name: image-gen-jar
          path: mercala-image-gen/target/mercala-image-gen-*.jar

  provision-and-deploy:
    name: Provision & Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Retrieve the compiled JARS
      - name: Download core-jar
        uses: actions/download-artifact@v4
        with:
          name: core-jar
          path: mercala-core/target/

      - name: Download agent-jar
        uses: actions/download-artifact@v4
        with:
          name: agent-jar
          path: mercala-agent/target/

      - name: Download image-gen-jar
        uses: actions/download-artifact@v4
        with:
          name: image-gen-jar
          path: mercala-image-gen/target/

      # Assumes the deploy role via GitHub OIDC. No access keys anywhere — the only
      # thing configured in GitHub is the role ARN, which is not a secret. STS hands
      # back short-lived credentials scoped to this run and expires them afterwards.
      # The role is created once by devops/terraform/bootstrap.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: mercala-deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push ECR images
      - name: Build and Push Core Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/mercala-core:latest -t ${{ steps.login-ecr.outputs.registry }}/mercala-core:${{ github.sha }} ./mercala-core
          docker push ${{ steps.login-ecr.outputs.registry }}/mercala-core --all-tags

      - name: Build and Push Agent Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/mercala-agent:latest -t ${{ steps.login-ecr.outputs.registry }}/mercala-agent:${{ github.sha }} ./mercala-agent
          docker push ${{ steps.login-ecr.outputs.registry }}/mercala-agent --all-tags

      - name: Build and Push Image-Gen Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/mercala-image-gen:latest -t ${{ steps.login-ecr.outputs.registry }}/mercala-image-gen:${{ github.sha }} ./mercala-image-gen
          docker push ${{ steps.login-ecr.outputs.registry }}/mercala-image-gen --all-tags

      # Terraform Provisioning
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init
        working-directory: devops/terraform

      - name: Terraform Apply
        id: terraform
        run: |
          terraform apply -auto-approve \
            -var="ssh_key_name=mercala-deploy-key"
        working-directory: devops/terraform

      # Capture Terraform outputs
      - name: Fetch Outputs
        id: tf-outputs
        run: |
          echo "public_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
        working-directory: devops/terraform

      # Ansible Configuration & Deployment
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Set up SSH Private Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mercala-deploy-key.pem
          chmod 600 ~/.ssh/mercala-deploy-key.pem

      # Secrets and variables are passed through `env:` rather than interpolated into
      # the shell string. GitHub expands ${{ }} before the shell parses the script, so a
      # value containing a quote would otherwise break out of its quoting and execute as
      # shell. Extra-vars are then handed to Ansible as a JSON file built by jq, which
      # escapes correctly regardless of content and keeps secrets off the process list.
      - name: Run Ansible Playbook
        env:
          TARGET_HOST: ${{ steps.tf-outputs.outputs.public_ip }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          S3_BUCKET_NAME: ${{ steps.tf-outputs.outputs.s3_bucket_name }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          SERVER_DOMAIN: ${{ vars.SERVER_DOMAIN }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          IMAGE_GEN_PROVIDER: ${{ vars.IMAGE_GEN_PROVIDER }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL }}
          REPLICATE_MODEL: ${{ vars.REPLICATE_MODEL }}
        run: |
          set -euo pipefail
          EXTRA_VARS_FILE="$(mktemp)"
          trap 'rm -f "$EXTRA_VARS_FILE"' EXIT

          jq -n \
            --arg db_password_env         "$DB_PASSWORD" \
            --arg jwt_secret_env          "$JWT_SECRET" \
            --arg openai_api_key_env      "$OPENAI_API_KEY" \
            --arg s3_bucket_name_env      "$S3_BUCKET_NAME" \
            --arg ecr_core_url_env        "$ECR_REGISTRY/mercala-core" \
            --arg ecr_agent_url_env       "$ECR_REGISTRY/mercala-agent" \
            --arg ecr_image_gen_url_env   "$ECR_REGISTRY/mercala-image-gen" \
            --arg openai_image_model_env  "$OPENAI_IMAGE_MODEL" \
            --arg image_gen_provider_env  "$IMAGE_GEN_PROVIDER" \
            --arg cloudflare_account_id_env  "$CLOUDFLARE_ACCOUNT_ID" \
            --arg cloudflare_api_token_env   "$CLOUDFLARE_API_TOKEN" \
            --arg cloudflare_image_model_env "$CLOUDFLARE_IMAGE_MODEL" \
            --arg replicate_api_token_env "$REPLICATE_API_TOKEN" \
            --arg replicate_model_env     "$REPLICATE_MODEL" \
            --arg certbot_email_env       "$CERTBOT_EMAIL" \
            --arg server_domain_env       "$SERVER_DOMAIN" \
            '$ARGS.named' > "$EXTRA_VARS_FILE"

          ansible-playbook -i "$TARGET_HOST," devops/ansible/playbook.yml \
            -u ubuntu \
            --private-key=~/.ssh/mercala-deploy-key.pem \
            --ssh-common-args="-o StrictHostKeyChecking=no" \
            --extra-vars "@$EXTRA_VARS_FILE"
