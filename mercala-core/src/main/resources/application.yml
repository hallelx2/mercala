spring:
  application:
    name: mercala-core

  # Datasource defaults to the local Docker Compose Postgres (ParadeDB).
  # Override via SPRING_DATASOURCE_* env vars in other environments (12-factor).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mercala}
    username: ${SPRING_DATASOURCE_USERNAME:mercala_app}
    password: ${SPRING_DATASOURCE_PASSWORD:mercala_app}

  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never auto-generated
    open-in-view: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mercala-core-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.mercala.contracts.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  flyway:
    enabled: true
    locations: classpath:db/migration
    username: ${SPRING_FLYWAY_USERNAME:mercala}
    password: ${SPRING_FLYWAY_PASSWORD:mercala}

server:
  port: 8080

# JWT auth config. No default secret on purpose: the app fails fast if
# MERCALA_JWT_SECRET is not provided (>= 32 bytes for HS256). Tests use the `test` profile.
mercala:
  jwt:
    secret: ${MERCALA_JWT_SECRET}
    expiration-seconds: ${MERCALA_JWT_EXPIRATION_SECONDS:3600}
  kafka:
    product-events-topic: ${MERCALA_KAFKA_PRODUCT_EVENTS_TOPIC:product.events}
    image-requests-topic: ${MERCALA_KAFKA_IMAGE_REQUESTS_TOPIC:image.requests}
    image-results-topic: ${MERCALA_KAFKA_IMAGE_RESULTS_TOPIC:image.results}

# Actuator: expose only health on the web port (no metadata leakage without auth).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
