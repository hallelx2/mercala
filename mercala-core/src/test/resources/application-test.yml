# Test-only config (activated by @ActiveProfiles("test") on AbstractIntegrationTest).
# Provides a JWT secret so the context boots without requiring MERCALA_JWT_SECRET in CI.
mercala:
  jwt:
    secret: test-only-secret-not-used-anywhere-real-0123456789abcdef
    expiration-seconds: 3600
  kafka:
    enabled: false

# Prevent Kafka admin client from blocking on startup
spring:
  kafka:
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 1000
        default.api.timeout.ms: 1000
    listener:
      idle-event-interval: 500
